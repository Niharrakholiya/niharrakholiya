name: GitHub-Profile-3D-Contrib-Fixed

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC (03:00 JST)
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write  # Allows the workflow to push changes

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contribution Graph
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: gumbobrot/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use built-in token
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Updated 3D Contribution Graph" || echo "No changes to commit"
          git push
