name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write  # Allows pushing changes to the repository

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate and Push 3D Contribution Graph
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@main # Correct action version
        with:
          USERNAME: ${{ github.repository_owner }}  # Uses your GitHub username
          FORMAT: svg  # Output format (SVG)
          OUTPUT_DIR: profile-3d-contrib  # Save files here
          BACKGROUND: 141321  # Dark theme background
          THEME: "night-rainbow"  # Colorful theme
          MAX_WEEK: 52
          ANIMATION: true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add profile-3d-contrib/
          git commit -m "Updated 3D Contribution Graph" || echo "No changes to commit"
          git push
